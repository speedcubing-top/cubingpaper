name: Build Template

on:
  workflow_call:
    inputs:
      build_only:
        required: false
        type: boolean
        default: false
    secrets:
      NEXUS_USERNAME:
        required: false
      NEXUS_PASSWORD:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # Compute build version lists earlier runs

    steps:
    - name: checkout
      uses: actions/checkout@v7

    - name: setup-java 8
      uses: actions/setup-java@v6
      with:
        java-version: '8'
        distribution: 'temurin'
        
    - name: Set Git user and email
      run: |
        git config --global user.name "speedcubing"
        git config --global user.email "git@speedcubing.top"

    # version shown as "This server is running CubingPaper version <x>": the build date (Asia/Taipei),
    # plus .1, .2, ... when earlier deploying builds already ran that day
    - name: Compute build version
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        today=$(TZ=Asia/Taipei date +%Y.%m.%d)
        since=$(date -u -d "$(TZ=Asia/Taipei date +%Y-%m-%d) 00:00 +0800" +%Y-%m-%dT%H:%M:%SZ)
        earlier=$(gh api "repos/${{ github.repository }}/actions/workflows/build-and-push.yml/runs?status=success&created=%3E%3D$since&per_page=100" \
          --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }} and .event != "pull_request")] | length')
        version="$today"
        if [ "$earlier" -gt 0 ]; then version="$today.$earlier"; fi
        echo "CUBINGPAPER_VERSION=$version" >> "$GITHUB_ENV"
        echo "CubingPaper version: $version"

    - name: Run build.sh
      run: |
        chmod +x ./build.sh
        ./build.sh

    - name: setup ~/.m2/settings.xml
      if: ${{ !inputs.build_only }}
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml <<EOF
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
          xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
          <servers>
            <server>
              <id>speedcubing-public-projects-release</id>
              <username>${{ secrets.NEXUS_USERNAME }}</username>
              <password>${{ secrets.NEXUS_PASSWORD }}</password>
            </server>
            <server>
              <id>speedcubing-public-projects-snapshot</id>
              <username>${{ secrets.NEXUS_USERNAME }}</username>
              <password>${{ secrets.NEXUS_PASSWORD }}</password>
            </server>
          </servers>
        </settings>
        EOF

    - name: Deploy to Nexus
      if: ${{ !inputs.build_only }}
      run: |
        mvn deploy -B --no-transfer-progress -DskipTests -Ddescribe="$CUBINGPAPER_VERSION"
